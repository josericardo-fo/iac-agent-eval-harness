# Adaptada do aws-bench (compute-and-data/dynamodb-strip-ec2-fields-from-prod), commit fixado
# abaixo, Apache-2.0 (atribuição em ../AWS-BENCH-NOTICE.md). upstream/ guarda cópias literais do
# instruction.md e do tests/check.py; os hashes estão em upstream_sha256.
# Adaptações:
# - prompt.md = instruction.md com o {{...}} trocado pelo valor de [placeholders] e sem o
#   parágrafo "IMPORTANT: Write your final prose answer to `/logs/agent/agent-output.txt`.".
# - check.py é um adaptador que roda upstream/check.py sem alterá-lo, com as variáveis de
#   [check_env] (o [verifier.env] original com o nosso nome) e um rewardkit falso.
# - Estado inicial reduzido: em vez do cenário CDK inteiro (stack dynamodb_fyu89ikhg), só a
#   tabela (chave id, GSI EnvironmentIndex environment/ec2_instance_type, como no CDK) e os 100
#   itens gerados uma vez pelo gerador determinístico do pre_invoke/reset.py e embutidos no
#   initial.tf. Diferenças: PAY_PER_REQUEST (o CDK usa o provisionado padrão) e sem
#   point-in-time recovery (custo; a tarefa não depende disso). O agente não vê o initial.tf
#   (hide_initial).
# - Sem referência Terraform: remover atributos de itens existentes é operação de dados; o
#   aws_dynamodb_table_item só gerencia itens criados pela própria configuração (importá-los e
#   reescrevê-los não é "remover campos" e exigiria conhecer cada item de antemão).
