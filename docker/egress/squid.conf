# Proxy de egresso do agente (E3): só CONNECT/HTTP para os domínios de allowed.txt, sem cache.
# allowed.txt é gerado na subida por render.sh (host do ANTHROPIC_BASE_URL; .amazonaws.com só no
# proxy do alvo aws).
http_port 3128
acl allowed_domains dstdomain "/etc/squid/allowed.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all
cache deny all
# Só método, host e status no log (sem query string nem cabeçalhos).
strip_query_terms on
# Logs nos arquivos padrão da imagem (o squid troca de usuário e não abre /dev/stdout);
# render.sh os repassa ao `docker logs`.
access_log daemon:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
pid_filename none
