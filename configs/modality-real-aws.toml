# Modalidades na AWS real (us-east-1): as 25 tarefas menos task-201 (MSK, config própria).
[run]
name = "modality-real-aws"
reps = 3
runs_dir = "runs"

[modality]
tasks = [
  # criação: 5 originais + 7 sorteadas (docs/selecao-tarefas-modalidades.md)
  "task-108", "task-115", "task-230", "task-231", "task-234",
  "task-110", "task-118", "task-130", "task-233", "task-373", "task-375",
  # modificação
  "mod-s3-versioning", "mod-dynamodb-pitr", "mod-sg-https",
  "mod-s3-encryption", "mod-sqs-retention", "mod-iam-user-policy", "mod-dynamodb-ttl",
  "mod-secret-tag",
  # remoção
  "del-s3-bucket", "del-sqs-dev", "del-iam-user",
  # consulta
  "query-sg-ssh-open", "query-dynamodb-ondemand",
]
modalities = ["terraform", "cli", "boto3"]

[agent]
provider = "anthropic"
# ID aceito pelo gateway atual (middleware); a API direta usa "claude-sonnet-5-5".
model = "Sonnet 5.5"
max_tokens = 8192
# effort = "medium"   # opcional; só é enviado quando definido

[feedback]
# Truncagem da saída de execução (a mesma do feedback do agente).
max_chars = 2000

[sandbox]
# AWS real (README, "AWS real"): credenciais IAC_AWS_* do ambiente; reset = limpeza por inventário.
kind = "aws"
# Guarda de identidade: o run recusa qualquer outra identidade (root, outra conta).
expected_arn = "arn:aws:iam::931493484341:user/iac-harness"
region = "us-east-1"

[toolchain]
mode = "docker"   # docker | local
image = "iac-harness-toolchain:latest"
# Timeout por comando (terraform, bash run.sh, python3 main.py, check.py).
timeout_s = 1800   # RDS, EC2 e a limpeza levam minutos

# US$ por milhão de tokens: [entrada, saída]. Confirme os valores vigentes antes de reportar custo.
[prices]
"Sonnet 5.5" = [3.0, 15.0]
