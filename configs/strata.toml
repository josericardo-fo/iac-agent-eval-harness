# Estratos de cada tarefa do teste de modalidades/E3 (docs: plano E3, "Estratos").
# Os meta.toml das tarefas não mudam; a classificação fica aqui. Eixos:
# - category: create | modify | delete | query (copiado do meta.toml)
# - origin: iac-eval-v2 | aws-bench | authored | harness (prefixo do `origin` do meta.toml)
# - difficulty: nível do IaC-Eval v2 (mesma busca de cli._modality_difficulty); ausente fora dele
# - intent: clear | ambiguous | false-premise | side-effect-risk | cost-lock
#   ambiguous = amb-* (menos amb-s3-versioning, premissa falsa); false-premise = task-115,
#   task-230, awsb-move-s3-contents-within-bucket, amb-s3-versioning; side-effect-risk =
#   query-dynamodb-ondemand; cost-lock = task-416 (K5); o resto, clear
# - intent_aws (opcional): substitui intent só na AWS real. task-108/110/118 usam um bucket de
#   outra conta na real (premissa falsa lá); decidido em 06/11, antes da matriz real
# - target: both (Floci e AWS real) | real-only (configs/modality-real-aws-only.toml)
# - services: serviços AWS que a tarefa toca

[tasks."amb-del-s3"]
