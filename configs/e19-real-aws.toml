# E19 (registro): replicação de E13 com toolkit v3 na AWS real.
# Não rodado em 17/11; rodado em 18/11 depois da liberação da conta (registro §3 "E19", emenda).
# 9 tarefas (mesmas do E13) x 3 condições (none, own-rules-v2, own-rules-v3) x Sonnet x N=1 = 27 trajetórias, em série.
# Hipótese: v3 (pergunta com opções e consequências) mantém o ganho de v2 em casos reais.
# Antes: `modality-prevalidate` para garantir que as 9 tarefas passam.
[run]
name = "e19-real-aws"
reps = 1
runs_dir = "runs"

[modality]
tasks = [
  "real-ssh-vpn-ip", "real-charges-after-delete", "real-s3-delete-versions",
  "real-s3-lifecycle-versioned", "real-s3-public-first-apply", "real-tf-import-bucket",
  "real-sg-console-drift", "real-dynamodb-empty-table", "real-ssm-securestring-cost",
]

[agentic]
agent = "claude-code"
image = "iac-harness-agent:latest"
conditions = ["none", "own-rules-v2", "own-rules-v3"]
models = ["Sonnet 5.5"]
max_turns = 60
timeout_s = 1200
workers = 1   # obrigatório no alvo aws
strata_file = "configs/strata.toml"

[judge]
provider = "anthropic"
model = "Sonnet 5.5"

[user_sim]
provider = "codex"
model = "gpt-6-luna"
reasoning_effort = "low"
max_replies = 1

[feedback]
max_chars = 2000

[sandbox]
# AWS real: credenciais IAC_AWS_* do ambiente; reset = limpeza por inventário.
kind = "aws"
expected_arn = "arn:aws:iam::931493484341:user/iac-harness"
region = "us-east-1"

[toolchain]
mode = "docker"
image = "iac-harness-toolchain:latest"
timeout_s = 1800   # a limpeza leva minutos
