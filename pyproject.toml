[project]
name = "iac-agent-eval-harness"
version = "0.1.0"
description = "Harness para medir o ganho incremental de feedback (validate/plan/OPA/sandbox) em agentes que geram Terraform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["anthropic", "httpx2>=2.13,<3"]

[project.scripts]
iac-harness = "iac_harness.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iac_harness"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = '-m "not integration"'
markers = ["integration: exige Docker + Floci (rode com -m integration)"]
